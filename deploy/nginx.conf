# Zubok — statická SPA, žádný backend.
#
# Nasazení na serveru:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/zubok
#   sudo ln -s /etc/nginx/sites-available/zubok /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# HTTPS: nejjednodušší je nechat certifikát nasadit certbotem —
#   sudo certbot --nginx -d zubok.example.cz
# ten si do tohoto souboru sám doplní listen 443, cesty k certifikátu
# a přesměrování z HTTP.

server {
    listen      80;
    listen      [::]:80;
    server_name zubok.example.cz;        # ← doplnit doménu

    root  /var/www/zubok;                # ← musí sedět s REMOTE_DIR v deploy.conf
    index index.html;

    # Generátor běží celý v prohlížeči, nic se nikam neodesílá.
    add_header X-Content-Type-Options nosniff       always;
    add_header X-Frame-Options        SAMEORIGIN    always;
    add_header Referrer-Policy        no-referrer   always;

    # ─── Komprese ──────────────────────────────────────────────────
    # Největší položka je three.js (~700 kB → ~190 kB po gzipu).
    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/javascript
                      application/json image/svg+xml;

    # ─── Statická aktiva s otiskem v názvu ────────────────────────
    # Vite dává do jména souboru hash, takže se obsah nikdy nemění
    # pod stejnou adresou — může se cachovat natrvalo.
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # ─── index.html se necachuje ──────────────────────────────────
    # Jinak by prohlížeč po nasazení nové verze držel starý soubor
    # s odkazy na už smazaná aktiva.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Aplikace nemá router, fallback je tu jen pro překlepy v URL.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Skryté soubory neservírovat
    location ~ /\. {
        deny all;
    }
}
